<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cinematic Heritage Auto Finance showroom with luxury SUV">
<defs>
 <linearGradient id="night" x2="1" y2="1"><stop stop-color="#080812"/><stop offset=".48" stop-color="#1b1030"/><stop offset="1" stop-color="#090811"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#211536"/><stop offset=".55" stop-color="#24172d"/><stop offset="1" stop-color="#080912"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0b0"/><stop offset=".35" stop-color="#f4c25b"/><stop offset="1" stop-color="#9a5c1e"/></linearGradient>
 <linearGradient id="car" x2="0" y2="1"><stop stop-color="#3e3b49"/><stop offset=".3" stop-color="#171923"/><stop offset=".75" stop-color="#06070c"/><stop offset="1" stop-color="#25212b"/></linearGradient>
 <linearGradient id="wind" x2=".2" y2="1"><stop stop-color="#a7b4d1" stop-opacity=".75"/><stop offset="1" stop-color="#1c1b2b" stop-opacity=".9"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#1b1427"/><stop offset="1" stop-color="#05060b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#b35bff" stop-opacity=".35"/><stop offset="1" stop-color="#7b32c6" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
